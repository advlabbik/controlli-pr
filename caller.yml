name: compatibilita-main
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  compat:
    # dei commenti contano solo quelli che riguardano il controllo, anche modificati o cancellati
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'COMPATIBILITA') ||
      contains(github.event.comment.body, 'EMERGENZA') ||
      contains(github.event.changes.body.from, 'COMPATIBILITA') ||
      contains(github.event.changes.body.from, 'EMERGENZA')))
    concurrency:
      group: compatibilita-${{ github.event.pull_request.number || github.event.issue.number }}
    uses: advlabbik/controlli-pr/.github/workflows/compat.yml@main
